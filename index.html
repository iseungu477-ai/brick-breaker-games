<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네온 브레이크아웃 아케이드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #05050a;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .arcade-font {
            font-family: 'Orbitron', sans-serif;
        }
        .neon-glow {
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.7), 0 0 20px rgba(168, 85, 247, 0.5), 0 0 30px rgba(168, 85, 247, 0.3);
        }
        .neon-box {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3), inset 0 0 15px rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.4);
        }
        .neon-btn {
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.5);
            transition: all 0.2s ease;
        }
        .neon-btn:hover {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.8), 0 0 10px rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        canvas {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);
            border-radius: 0.75rem;
            touch-action: none;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-purple-950/20 to-black">

    <!-- Header Navigation -->
    <header class="w-full max-w-5xl flex justify-between items-center py-4 px-6 mb-2 bg-slate-900/60 backdrop-blur-md rounded-2xl border border-slate-800">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center neon-box">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg>
            </div>
            <h1 class="arcade-font text-xl md:text-2xl font-black tracking-wider bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent neon-glow">
                NEON BREAKOUT
            </h1>
        </div>
        <div id="user-status" class="hidden items-center space-x-3">
            <div class="text-right">
                <p class="text-xs text-slate-400">플레이어</p>
                <p id="display-username" class="arcade-font text-sm font-bold text-pink-400 truncate max-w-[120px] md:max-w-xs"></p>
            </div>
            <button id="logout-btn" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition">로그아웃</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="w-full max-w-5xl flex-1 flex flex-col md:flex-row gap-6 items-center justify-center my-auto">
        
        <!-- Login Screen -->
        <div id="login-screen" class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl p-8 rounded-3xl neon-box flex flex-col items-center text-center">
            <div class="w-16 h-16 bg-gradient-to-tr from-purple-600 to-pink-600 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-purple-500/30">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            <h2 class="arcade-font text-2xl font-bold mb-2 text-white">아케이드 입장</h2>
            <p class="text-slate-400 text-sm mb-6">순위표에 등록할 닉네임을 입력하고 게임을 시작하세요!</p>
            
            <form id="login-form" class="w-full space-y-4">
                <div>
                    <input type="text" id="username-input" placeholder="닉네임 입력 (2~12자)" required maxlength="12" 
                        class="w-full px-4 py-3 bg-slate-950/80 border border-slate-700 rounded-xl text-center text-white arcade-font focus:outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 transition">
                </div>
                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white arcade-font font-bold rounded-xl neon-btn transition">
                    게임 시작하기
                </button>
            </form>
            <div id="login-error" class="mt-4 text-xs text-pink-400 hidden"></div>
        </div>

        <!-- Game Active Screen -->
        <div id="game-screen" class="hidden flex flex-col md:flex-row gap-6 items-center justify-center w-full">
            
            <!-- Canvas Container -->
            <div class="relative flex flex-col items-center bg-slate-900/70 p-4 rounded-3xl border border-slate-800 backdrop-blur-md">
                <div class="w-full flex justify-between items-center mb-3 px-2 text-sm arcade-font">
                    <div class="flex space-x-4">
                        <span class="text-slate-400">점수: <strong id="current-score" class="text-cyan-400">0</strong></span>
                        <span class="text-slate-400">목숨: <strong id="current-lives" class="text-pink-400">3</strong></span>
                    </div>
                    <div class="flex space-x-4">
                        <span class="text-slate-400">스테이지: <strong id="current-stage" class="text-purple-400">1</strong></span>
                    </div>
                </div>

                <div class="relative">
                    <canvas id="gameCanvas" width="480" height="600" class="w-full max-w-[480px] h-auto bg-slate-950"></canvas>
                    
                    <!-- Overlay Message Box -->
                    <div id="game-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center rounded-xl p-6 text-center transition-opacity">
                        <h3 id="overlay-title" class="arcade-font text-3xl font-black mb-2 bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">READY?</h3>
                        <p id="overlay-desc" class="text-slate-300 text-sm mb-6">화살표 키 또는 마우스/터치로 패를 조작하세요.</p>
                        <button id="overlay-action-btn" class="px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white arcade-font font-bold rounded-xl neon-btn transition">
                            게임 시작
                        </button>
                    </div>
                </div>

                <div class="mt-3 text-xs text-slate-500 flex justify-between w-full px-2">
                    <span>조작: ← → 화살표 / 마우스 이동</span>
                    <span>일시정지: ESC</span>
                </div>
            </div>

            <!-- Leaderboard Sidebar -->
            <div class="w-full md:w-80 bg-slate-900/70 p-5 rounded-3xl border border-slate-800 backdrop-blur-md flex flex-col h-[520px]">
                <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-800">
                    <h3 class="arcade-font text-base font-bold text-cyan-400 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                        실시간 랭킹 (Top 10)
                    </h3>
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                </div>
                
                <div id="leaderboard-list" class="flex-1 overflow-y-auto space-y-2 pr-1">
                    <div class="text-center py-12 text-slate-500 text-sm">순위 불러오는 중...</div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs text-slate-600 arcade-font">
        Neon Breakout Arcade • Firebase Realtime Database
    </footer>

    <!-- Firebase SDK Modular Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        // Firebase 설정 (요구사항 반영)
        const firebaseConfig = {
            apiKey: "AIzaSyB5Fk_7Q_p1OdQQHnt6NvcANv34kghaJ-w",
            authDomain: "breaker-game-cf5d4.firebaseapp.com",
            databaseURL: "https://breaker-game-cf5d4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "breaker-game-cf5d4",
            storageBucket: "breaker-game-cf5d4.firebasestorage.app",
            messagingSenderId: "74121787477",
            appId: "1:74121787477:web:b3de20b92eb7e3cc823cdc",
            measurementId: "G-1S6EG6BSEH"
        };

        // Initialize Firebase & Analytics
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        // --- DOM Elements ---
        const loginScreen = document.getElementById('login-screen');
        const gameScreen = document.getElementById('game-screen');
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username-input');
        const loginError = document.getElementById('login-error');
        const userStatus = document.getElementById('user-status');
        const displayUsername = document.getElementById('display-username');
        const logoutBtn = document.getElementById('logout-btn');

        const currentScoreEl = document.getElementById('current-score');
        const currentLivesEl = document.getElementById('current-lives');
        const currentStageEl = document.getElementById('current-stage');
        
        const gameOverlay = document.getElementById('game-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const overlayActionBtn = document.getElementById('overlay-action-btn');
        const leaderboardList = document.getElementById('leaderboard-list');

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- Game State Variables ---
        let currentUser = localStorage.getItem('arcade_username') || '';
        let score = 0;
        let lives = 3;
        let stage = 1;
        let gameRunning = false;
        let gamePaused = false;
        let animationFrameId = null;

        // Paddle
        const paddleWidth = 90;
        const paddleHeight = 12;
        let paddleX = (canvas.width - paddleWidth) / 2;
        let rightPressed = false;
        let leftPressed = false;

        // Ball
        let ballX = canvas.width / 2;
        let ballY = canvas.height - 30;
        let ballDX = 4;
        let ballDY = -4;
        const ballRadius = 8;

        // Bricks
        let brickRowCount = 5;
        let brickColumnCount = 7;
        let brickWidth = 56;
        let brickHeight = 20;
        let brickPadding = 10;
        let brickOffsetTop = 40;
        let brickOffsetLeft = 25;
        let bricks = [];

        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    let health = (brickRowCount - r);
                    bricks[c][r] = { x: 0, y: 0, status: health, maxHealth: health };
                }
            }
        }

        // --- User Authentication / Session ---
        if (currentUser) {
            loginScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            userStatus.classList.remove('hidden');
            userStatus.classList.add('flex');
            displayUsername.textContent = currentUser;
            initLeaderboard();
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = usernameInput.value.trim();
            if (name.length < 2) {
                loginError.textContent = "닉네임은 2자 이상 입력해주세요.";
                loginError.classList.remove('hidden');
                return;
            }
            currentUser = name;
            localStorage.setItem('arcade_username', currentUser);
            
            loginScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            userStatus.classList.remove('hidden');
            userStatus.classList.add('flex');
            displayUsername.textContent = currentUser;
            
            initLeaderboard();
            resetGame();
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('arcade_username');
            currentUser = '';
            gameRunning = false;
            cancelAnimationFrame(animationFrameId);
            gameScreen.classList.add('hidden');
            userStatus.classList.add('hidden');
            userStatus.classList.remove('flex');
            loginScreen.classList.remove('hidden');
            usernameInput.value = '';
        });

        // --- Controls (Keyboard & Mouse/Touch) ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightPressed = true;
            else if (e.key === 'Left' || e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = true;
            else if (e.key === 'Escape') if (gameRunning) togglePause();
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightPressed = false;
            else if (e.key === 'Left' || e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const rootX = e.clientX - rect.left;
            const scaleX = canvas.width / rect.width;
            paddleX = (rootX * scaleX) - paddleWidth / 2;
            if (paddleX < 0) paddleX = 0;
            if (paddleX > canvas.width - paddleWidth) paddleX = canvas.width - paddleWidth;
        });

        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            const scaleX = canvas.width / rect.width;
            paddleX = (touchX * scaleX) - paddleWidth / 2;
            if (paddleX < 0) paddleX = 0;
            if (paddleX > canvas.width - paddleWidth) paddleX = canvas.width - paddleWidth;
            e.preventDefault();
        }, { passive: false });

        // --- Game Logic & Physics ---
        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status > 0) {
                        if (
                            ballX > b.x &&
                            ballX < b.x + brickWidth &&
                            ballY > b.y &&
                            ballY < b.y + brickHeight
                        ) {
                            ballDY = -ballDY;
                            b.status--;
                            score += 10 * stage;
                            currentScoreEl.textContent = score;
                            checkWinCondition();
                        }
                    }
                }
            }
        }

        function checkWinCondition() {
            let totalBricksLeft = 0;
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    totalBricksLeft += bricks[c][r].status;
                }
            }
            if (totalBricksLeft === 0) {
                gameRunning = false;
                saveScoreToFirebase(currentUser, score);
                showOverlay("STAGE CLEAR!", `스테이지 ${stage} 클리어! 다음 스테이지로 진입합니다.`, "다음 스테이지", nextStage);
            }
        }

        function nextStage() {
            stage++;
            currentStageEl.textContent = stage;
            ballDX *= 1.15;
            ballDY *= 1.15;
            resetBallAndPaddle();
            initBricks();
            gameOverlay.classList.add('opacity-0', 'pointer-events-none');
            gameRunning = true;
            draw();
        }

        function resetBallAndPaddle() {
            paddleX = (canvas.width - paddleWidth) / 2;
            ballX = canvas.width / 2;
            ballY = canvas.height - 30;
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#ec4899';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ec4899';
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddleX, canvas.height - paddleHeight - 10, paddleWidth, paddleHeight, 6);
            ctx.fillStyle = '#3b82f6';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#3b82f6';
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function drawBricks() {
            const colors = ['#f43f5e', '#fb923c', '#fbbf24', '#34d399', '#38bdf8'];
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status > 0) {
                        let brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        let brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        
                        ctx.beginPath();
                        ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 4);
                        ctx.fillStyle = colors[r % colors.length];
                        ctx.shadowBlur = bricks[c][r].status > 1 ? 12 : 5;
                        ctx.shadowColor = colors[r % colors.length];
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff33';
                        ctx.stroke();
                        ctx.closePath();
                        ctx.shadowBlur = 0;
                    }
                }
            }
        }

        function draw() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            if (ballX + ballDX > canvas.width - ballRadius || ballX + ballDX < ballRadius) {
                ballDX = -ballDX;
            }
            if (ballY + ballDY < ballRadius) {
                ballDY = -ballDY;
            } else if (ballY + ballDY > canvas.height - ballRadius - 10) {
                if (ballX > paddleX && ballX < paddleX + paddleWidth) {
                    let hitPoint = ballX - (paddleX + paddleWidth / 2);
                    ballDX = hitPoint * 0.15;
                    ballDY = -Math.abs(ballDY);
                } else {
                    lives--;
                    currentLivesEl.textContent = lives;
                    if (!lives) {
                        gameOver();
                        return;
                    } else {
                        resetBallAndPaddle();
                    }
                }
            }

            ballX += ballDX;
            ballY += ballDY;

            if (rightPressed && paddleX < canvas.width - paddleWidth) {
                paddleX += 7;
            } else if (leftPressed && paddleX > 0) {
                paddleX -= 7;
            }

            animationFrameId = requestAnimationFrame(draw);
        }

        function gameOver() {
            gameRunning = false;
            saveScoreToFirebase(currentUser, score);
            showOverlay("GAME OVER", `최종 점수: ${score}점`, "다시 시작", resetGame);
        }

        function togglePause() {
            if (gamePaused) {
                gamePaused = false;
                gameOverlay.classList.add('opacity-0', 'pointer-events-none');
                gameRunning = true;
                draw();
            } else {
                gamePaused = true;
                gameRunning = false;
                showOverlay("일시 정지", "게임이 중단되었습니다.", "계속하기", togglePause);
            }
        }

        function resetGame() {
            score = 0;
            lives = 3;
            stage = 1;
            ballDX = 4;
            ballDY = -4;
            currentScoreEl.textContent = score;
            currentLivesEl.textContent = lives;
            currentStageEl.textContent = stage;
            resetBallAndPaddle();
            initBricks();
            gameOverlay.classList.add('opacity-0', 'pointer-events-none');
            gameRunning = true;
            draw();
        }

        function showOverlay(title, desc, btnText, callback) {
            overlayTitle.textContent = title;
            overlayDesc.textContent = desc;
            overlayActionBtn.textContent = btnText;
            gameOverlay.classList.remove('opacity-0', 'pointer-events-none');
            
            const newBtn = overlayActionBtn.cloneNode(true);
            overlayActionBtn.parentNode.replaceChild(newBtn, overlayActionBtn);
            newBtn.addEventListener('click', callback);
        }

        // --- Firebase Realtime Database Integration ---
        function saveScoreToFirebase(name, finalScore) {
            try {
                const scoresRef = ref(db, 'leaderboard');
                const dateStr = new Date().toISOString().split('T')[0];
                push(scoresRef, {
                    name: name,
                    score: finalScore,
                    date: dateStr
                }).catch(err => console.error("Firebase 저장 실패:", err));
            } catch (e) {
                console.error("Firebase 저장 에러:", e);
            }
        }

        function initLeaderboard() {
            try {
                const leaderboardRef = ref(db, 'leaderboard');
                const topScoresQuery = query(leaderboardRef, orderByChild('score'), limitToLast(10));

                onValue(topScoresQuery, (snapshot) => {
                    const data = snapshot.val();
                    if (!data) {
                        leaderboardList.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">기록이 없습니다. 첫 기록을 세워보세요!</div>`;
                        return;
                    }

                    const scoresArray = Object.keys(data).map(key => ({
                        id: key,
                        ...data[key]
                    })).sort((a, b) => b.score - a.score);

                    leaderboardList.innerHTML = '';
                    scoresArray.slice(0, 10).forEach((item, index) => {
                        const rankColors = ['text-amber-400 bg-amber-500/20', 'text-slate-300 bg-slate-400/20', 'text-amber-600 bg-amber-700/20'];
                        const rankBadgeClass = rankColors[index] || 'text-slate-400 bg-slate-800';

                        const row = document.createElement('div');
                        row.className = "p-3 bg-slate-950/50 rounded-xl border border-slate-800/80 flex items-center justify-between hover:border-purple-500/40 transition";
                        row.innerHTML = `
                            <div class="flex items-center gap-3">
                                <span class="arcade-font text-xs font-bold w-6 h-6 rounded-full ${rankBadgeClass} flex items-center justify-center">${index + 1}</span>
                                <div>
                                    <p class="text-sm font-semibold text-white truncate max-w-[120px]">${escapeHtml(item.name)}</p>
                                    <p class="text-[10px] text-slate-500">${item.date || '-'}</p>
                                </div>
                            </div>
                            <span class="arcade-font text-sm font-bold text-cyan-400">${item.score.toLocaleString()}</span>
                        `;
                        leaderboardList.appendChild(row);
                    });
                }, (error) => {
                    console.error("순위 데이터 읽기 오류:", error);
                    leaderboardList.innerHTML = `<div class="text-center py-12 text-pink-400 text-xs">순위 데이터를 불러오지 못했습니다.</div>`;
                });
            } catch (e) {
                console.error("Realtime Database 리스너 등록 실패:", e);
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 초기 화면 오버레이 설정
        showOverlay("NEON BREAKOUT", "모든 벽돌을 부수고 최고 기록에 도전하세요!", "게임 시작", resetGame);

    </script>
